<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>utaformatix3-ts playground</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 24px;
        line-height: 1.5;
      }
      main {
        max-width: 900px;
      }
      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin: 8px 0;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      select,
      input[type="file"],
      button {
        padding: 6px 8px;
      }
      #status {
        font-weight: 600;
      }
      #error {
        color: #b00020;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>utaformatix3-ts playground</h1>
      <p id="status">Loading IIFE...</p>
      <p>
        If IIFE is not loaded, build distribution first:
        <code>npm install</code> -> <code>npm run build:lib</code>
      </p>

      <div class="row"><strong>Input format: auto-detected from file extension</strong></div>

      <div class="row">
        <label>
          Input file
          <input id="inputFile" type="file" accept=".vsqx,.musicxml,.xml,.ufdata,.json" />
        </label>
      </div>

      <div class="row">
        <button id="downloadVsqxButton" type="button">Download VSQX</button>
        <button id="downloadMusicXmlButton" type="button">Download MusicXML</button>
        <button id="downloadUfdataButton" type="button">Download UFDATA</button>
      </div>

      <p id="error"></p>
    </main>

    <script src="./dist-lib/utaformatix3-ts.iife.js"></script>
    <script>
      (function () {
        const status = document.getElementById("status");
        const error = document.getElementById("error");
        const inputFile = document.getElementById("inputFile");
        const downloadVsqxButton = document.getElementById("downloadVsqxButton");
        const downloadMusicXmlButton = document.getElementById("downloadMusicXmlButton");
        const downloadUfdataButton = document.getElementById("downloadUfdataButton");
        if (
          !status ||
          !error ||
          !inputFile ||
          !downloadVsqxButton ||
          !downloadMusicXmlButton ||
          !downloadUfdataButton
        ) {
          return;
        }

        const api = window.Utaformatix3Ts;
        if (!api) {
          status.textContent = "IIFE not loaded: window.Utaformatix3Ts is undefined. Run npm run build:lib first.";
          return;
        }

        status.textContent = "IIFE loaded. Select file, then click output format button.";
        let detectedInputFormat = null;
        function detectInputFormatFromFileName(fileName) {
          const lower = fileName.toLowerCase();
          if (lower.endsWith(".vsqx")) return "vsqx";
          if (lower.endsWith(".musicxml")) return "musicxml";
          if (lower.endsWith(".ufdata") || lower.endsWith(".ufdata.json")) return "ufdata";
          if (lower.endsWith(".xml")) return "musicxml";
          if (lower.endsWith(".json")) return "ufdata";
          return null;
        }

        function parseProject(text, format) {
          if (format === "vsqx") return api.parseVsqx(text, { defaultLyric: "あ" });
          if (format === "musicxml") return api.parseMusicXml(text, { defaultLyric: "あ" });
          if (format === "ufdata") return api.parseUfdata(text);
          throw new Error("Unsupported input format: " + format);
        }

        function writeProject(project, format) {
          if (format === "vsqx") return { text: api.writeVsqx(project).content, ext: "vsqx" };
          if (format === "musicxml") return { text: api.writeMusicXml(project, { mode: "generate" }), ext: "musicxml" };
          if (format === "ufdata") return { text: api.writeUfdata(project), ext: "ufdata.json" };
          throw new Error("Unsupported output format: " + format);
        }

        function downloadText(text, extension, baseName) {
          const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = baseName + "." + extension;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }

        async function convertAndDownload(outputFormat) {
          error.textContent = "";
          const file = inputFile.files && inputFile.files[0];
          if (!file) {
            error.textContent = "Input file is not selected.";
            return;
          }
          const inputFormat = detectedInputFormat ?? detectInputFormatFromFileName(file.name);
          if (!inputFormat) {
            error.textContent = "Unknown input extension. Supported: .vsqx, .musicxml, .xml, .ufdata, .json";
            return;
          }
          try {
            const inputText = await file.text();
            const project = parseProject(inputText, inputFormat);
            const output = writeProject(project, outputFormat);
            const baseName = file.name.replace(/\.[^.]+$/, "") || "converted";
            downloadText(output.text, output.ext, baseName);
            status.textContent =
              "Converted and downloaded: " +
              inputFormat +
              " -> " +
              outputFormat +
              " / tracks=" +
              project.tracks.length;
          } catch (e) {
            const message = e instanceof Error ? e.message : String(e);
            error.textContent = "Convert failed:\n" + message;
            status.textContent = "Convert failed.";
          }
        }

        inputFile.addEventListener("change", function () {
          const file = inputFile.files && inputFile.files[0];
          if (!file) return;
          const detected = detectInputFormatFromFileName(file.name);
          if (detected) {
            detectedInputFormat = detected;
            status.textContent = "Input format auto-detected from extension: " + detected;
          } else {
            detectedInputFormat = null;
            status.textContent = "Unknown extension.";
          }
        });

        downloadVsqxButton.addEventListener("click", function () {
          convertAndDownload("vsqx");
        });
        downloadMusicXmlButton.addEventListener("click", function () {
          convertAndDownload("musicxml");
        });
        downloadUfdataButton.addEventListener("click", function () {
          convertAndDownload("ufdata");
        });
      })();
    </script>
  </body>
</html>
