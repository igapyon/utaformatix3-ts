<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>utaformatix3-ts playground</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 24px;
        line-height: 1.5;
      }
      main {
        max-width: 900px;
      }
      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin: 8px 0;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      input[type="file"],
      button {
        padding: 6px 8px;
      }
      #app-status {
        font-weight: 600;
      }
      #error {
        color: #b00020;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>utaformatix3-ts playground</h1>
      <p id="app-status">Loading app...</p>
      <p>
        Input format is auto-detected from extension:
        <code>.vsqx</code>, <code>.musicxml</code>, <code>.xml</code>, <code>.ufdata</code>, <code>.json</code>
      </p>

      <div class="row">
        <label>
          Input file
          <input id="inputFile" type="file" accept=".vsqx,.musicxml,.xml,.ufdata,.json" />
        </label>
      </div>

      <div class="row">
        <button id="downloadVsqxButton" type="button">Download VSQX</button>
        <button id="downloadMusicXmlButton" type="button">Download MusicXML</button>
        <button id="downloadUfdataButton" type="button">Download UFDATA</button>
      </div>

      <p id="error"></p>
    </main>

    <script>
      (function () {
        function requiredElement(id) {
          var element = document.getElementById(id);
          if (!element) {
            throw new Error("Required DOM element is missing: " + id);
          }
          return element;
        }

        function initPlayground(api) {
          var status = requiredElement("app-status");
          var error = requiredElement("error");
          var inputFile = requiredElement("inputFile");
          var downloadVsqxButton = requiredElement("downloadVsqxButton");
          var downloadMusicXmlButton = requiredElement("downloadMusicXmlButton");
          var downloadUfdataButton = requiredElement("downloadUfdataButton");

          status.textContent = "App loaded. Select file, then click output format button.";
          var detectedInputFormat = null;

          function detectInputFormatFromFileName(fileName) {
            var lower = fileName.toLowerCase();
            if (lower.endsWith(".vsqx")) return "vsqx";
            if (lower.endsWith(".musicxml")) return "musicxml";
            if (lower.endsWith(".ufdata") || lower.endsWith(".ufdata.json")) return "ufdata";
            if (lower.endsWith(".xml")) return "musicxml";
            if (lower.endsWith(".json")) return "ufdata";
            return null;
          }

          function parseProject(text, format) {
            if (format === "vsqx") return api.parseVsqx(text, { defaultLyric: "あ" });
            if (format === "musicxml") return api.parseMusicXml(text, { defaultLyric: "あ" });
            return api.parseUfdata(text);
          }

          function writeProject(project, format) {
            if (format === "vsqx") return { text: api.writeVsqx(project).content, ext: "vsqx" };
            if (format === "musicxml") return { text: api.writeMusicXml(project, { mode: "generate" }), ext: "musicxml" };
            return { text: api.writeUfdata(project), ext: "ufdata.json" };
          }

          function downloadText(text, extension, baseName) {
            var blob = new Blob([text], { type: "text/plain;charset=utf-8" });
            var url = URL.createObjectURL(blob);
            var a = document.createElement("a");
            a.href = url;
            a.download = baseName + "." + extension;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          }

          async function convertAndDownload(outputFormat) {
            error.textContent = "";
            var file = inputFile.files && inputFile.files[0];
            if (!file) {
              error.textContent = "Input file is not selected.";
              return;
            }
            var inputFormat = detectedInputFormat || detectInputFormatFromFileName(file.name);
            if (!inputFormat) {
              error.textContent = "Unknown input extension. Supported: .vsqx, .musicxml, .xml, .ufdata, .json";
              return;
            }
            try {
              var inputText = await file.text();
              var project = parseProject(inputText, inputFormat);
              var output = writeProject(project, outputFormat);
              var baseName = file.name.replace(/\.[^.]+$/, "") || "converted";
              downloadText(output.text, output.ext, baseName);
              status.textContent =
                "Converted and downloaded: " + inputFormat + " -> " + outputFormat + " / tracks=" + project.tracks.length;
            } catch (e) {
              var message = e instanceof Error ? e.message : String(e);
              error.textContent = "Convert failed:\n" + message;
              status.textContent = "Convert failed.";
            }
          }

          inputFile.addEventListener("change", function () {
            var file = inputFile.files && inputFile.files[0];
            if (!file) return;
            var detected = detectInputFormatFromFileName(file.name);
            if (detected) {
              detectedInputFormat = detected;
              status.textContent = "Input format auto-detected from extension: " + detected;
            } else {
              detectedInputFormat = null;
              status.textContent = "Unknown extension.";
            }
          });

          downloadVsqxButton.addEventListener("click", function () {
            void convertAndDownload("vsqx");
          });
          downloadMusicXmlButton.addEventListener("click", function () {
            void convertAndDownload("musicxml");
          });
          downloadUfdataButton.addEventListener("click", function () {
            void convertAndDownload("ufdata");
          });
        }

        if (location.protocol === "file:") {
          var status = document.getElementById("app-status");
          if (status) {
            status.textContent = "Loading local IIFE bundle from dist-lib...";
          }
          var script = document.createElement("script");
          script.src = "./dist-lib/utaformatix3-ts.iife.js";
          script.onload = function () {
            if (!window.Utaformatix3Ts) {
              if (status) {
                status.textContent = "IIFE is not available. Run npm run build:lib first.";
              }
              return;
            }
            initPlayground(window.Utaformatix3Ts);
          };
          script.onerror = function () {
            if (status) {
              status.textContent = "Failed to load dist-lib/utaformatix3-ts.iife.js. Run npm run build:lib first.";
            }
          };
          document.body.appendChild(script);
          return;
        }

        var moduleScript = document.createElement("script");
        moduleScript.type = "module";
        moduleScript.src = "/src/main.ts";
        document.body.appendChild(moduleScript);
      })();
    </script>
  </body>
</html>
